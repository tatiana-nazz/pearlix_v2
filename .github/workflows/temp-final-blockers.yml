name: Temporary final release blocker validation

on:
  push:
    branches:
      - fix/final-release-blockers
  pull_request:
    branches:
      - feat-admin-analytics-demo-data

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Compile backend and Space sources
        run: python -m compileall -q apps config deployment ../hf_space
      - name: Focused final-blocker tests
        run: >-
          python -m pytest -q
          tests/xrays/test_request_body_limits.py
          tests/deployment/test_phase63_archive_and_space.py
          tests/ai_results/test_remote_adapter.py
          tests/ai_results/test_local_ai_bundle_tools.py
      - name: Full backend suite
        run: python -m pytest -q
      - name: Django system check
        run: python manage.py check --settings=config.settings.test
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run --settings=config.settings.test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Production dependency advisory summary
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/pearlix-npm-audit.json
          audit_exit=$?
          set -e
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/pearlix-npm-audit.json', 'utf8'));
          const v = report.metadata?.vulnerabilities ?? {};
          console.log(`PRODUCTION_AUDIT total=${v.total ?? 0} low=${v.low ?? 0} moderate=${v.moderate ?? 0} high=${v.high ?? 0} critical=${v.critical ?? 0}`);
          if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);
          NODE
          echo "npm audit exit code (informational if only low/moderate): $audit_exit"
      - name: Typecheck
        run: npm run typecheck
      - name: Frontend tests
        run: npm run test:run
      - name: Production build
        run: npm run build
