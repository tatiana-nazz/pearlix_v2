name: Temporary X-ray review UI validation

on:
  pull_request:
    branches:
      - feat-admin-analytics-demo-data

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Focused X-ray UI tests
        run: >-
          npm run test:run --
          src/features/xrays/components/AiResultPanel.test.tsx
          src/features/xrays/components/ProtectedXrayViewer.test.tsx
          src/styles/v2/xray-review-fixes.contract.test.ts
      - name: Full frontend suite
        run: npm run test:run
      - name: Production build
        run: npm run build
      - name: Diff whitespace check
        working-directory: .
        run: git diff --check origin/feat-admin-analytics-demo-data...HEAD
