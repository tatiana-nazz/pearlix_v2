services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pearlix
      POSTGRES_USER: pearlix
      POSTGRES_PASSWORD: pearlix_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pearlix -d pearlix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
