services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pearlix
      POSTGRES_USER: pearlix
      POSTGRES_PASSWORD: ${PEARLIX_LOCAL_DB_PASSWORD:?Set PEARLIX_LOCAL_DB_PASSWORD in the ignored backend/.env file}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pearlix -d pearlix"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
